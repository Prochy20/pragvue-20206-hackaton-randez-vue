services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: icebreaker
      POSTGRES_PASSWORD: icebreaker
      POSTGRES_DB: icebreaker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U icebreaker']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
